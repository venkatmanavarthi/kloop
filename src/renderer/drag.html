<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <title>Drag to enable</title>
    <link rel="stylesheet" href="./drag.css" />
    <script type="module" src="./drag.ts"></script>
  </head>
  <body>
    <div class="panel">
      <!-- A looping demo: the icon is dragged up into the list, then switched on. -->
      <div class="demo" aria-hidden="true">
        <div class="win">
          <div class="win__bar"><i></i><i></i><i></i><span>Screen &amp; System Audio Recording</span></div>
          <ul class="win__list">
            <li><b></b><span></span><em></em></li>
            <li class="slot"><b></b><span></span><em></em></li>
          </ul>
        </div>
        <div class="ghost">
          <img data-icon alt="" />
          <svg class="cursor" viewBox="0 0 16 20" width="14" height="18">
            <path d="M1 1v15l4-4 3 6 2.5-1-3-6h5.5z" fill="#f5f5f5" stroke="#0a0a0a" stroke-width="1.2" />
          </svg>
        </div>
      </div>

      <ol class="captions">
        <li class="captions__drag"><span>1</span>Drag the icon into the list</li>
        <li class="captions__on"><span>2</span>Switch it on</li>
      </ol>
      <p class="note">When macOS asks, click <b>Quit &amp; Reopen</b>. KrackLoop comes right back.</p>

      <div class="source">
        <div class="tile" id="tile" draggable="true" title="Drag into System Settings">
          <img data-icon alt="" draggable="false" />
        </div>
        <div class="text">
          <strong>Drag <span id="name">KrackLoop</span> from here</strong>
          <button class="back" id="back">Back to KrackLoop</button>
        </div>
      </div>
    </div>
  </body>
</html>
